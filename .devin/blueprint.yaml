# https://docs.devin.ai/onboard-devin/environment-yaml
# Pure Helm IaC repo: 11 charts + dev/staging/prod value overlays. No Terraform, no chart deps, no app to run.
# One-time setup (e.g., install system tools, global CLIs).
initialize: |
  HELM_VERSION=v3.16.4
  KUBECTL_VERSION=v1.31.4
  curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tgz
  tar -xzf /tmp/helm.tgz -C /tmp
  sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
  rm -rf /tmp/helm.tgz /tmp/linux-amd64
  curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o /tmp/kubectl
  sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
  rm -f /tmp/kubectl
  pip install 'yamllint==1.37.1'
# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance: |
  helm version
# Reference info for agent
knowledge:
  - name: lint
    contents: |
      helm lint charts/*
  - name: validate
    contents: |
      # Render every chart against each environment overlay
      for chart in charts/*/; do
        name=$(basename "$chart")
        for env in dev staging prod; do
          helm template "$name" "$chart" -f "environments/$env/values.yaml" >/dev/null
        done
      done
  - name: yamllint
    contents: |
      # Static YAML only; helm templates contain Go templating and are skipped
      yamllint environments/ charts/*/values.yaml charts/*/Chart.yaml
