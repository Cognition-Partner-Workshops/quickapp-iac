replicaCount: 1

image:
  repository: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/product-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5004

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: product-service.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: product-service-tls
      hosts:
        - product-service.example.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

healthCheck:
  path: /healthz
  port: 5004

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
