replicaCount: 1

image:
  repository: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/product-service
  tag: latest
  pullPolicy: IfNotPresent

# Port the container listens on (matches ASPNETCORE_HTTP_PORTS in the image).
containerPort: 8080

service:
  type: ClusterIP
  port: 5004

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: product-service.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: product-service-tls
      hosts:
        - product-service.example.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Liveness (/health) reports process health; readiness (/ready) reports
# dependency (database) health. Both served on the container port.
healthCheck:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5

# Application configuration — externalized as environment variables.
# No hostnames or credentials are hardcoded in the image; they come from here
# (and, for secrets, from a Kubernetes Secret referenced below).
config:
  aspnetcoreEnvironment: Production
  database:
    host: postgresql
    port: 5432
    name: productdb
    username: postgres
    # Password is read from an existing Secret, never stored in values.
    existingSecret: product-service-db
    passwordKey: password

# Extra free-form environment variables (name/value pairs).
extraEnv: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
