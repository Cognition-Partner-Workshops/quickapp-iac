name: Order Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - "docker/order-service/**"
      - "charts/order-service/**"
      - ".github/workflows/order-service-ci.yaml"
  pull_request:
    branches: [main]
    paths:
      - "docker/order-service/**"
      - "charts/order-service/**"
      - ".github/workflows/order-service-ci.yaml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: workshop/order-service
  ECR_REGISTRY: 599083837640.dkr.ecr.us-east-1.amazonaws.com

jobs:
  lint-chart:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IaC repo
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint chart
        run: helm lint charts/order-service

      - name: Template chart (dev)
        run: |
          helm template order-service charts/order-service \
            -f environments/dev/values.yaml

      - name: Template chart (staging)
        run: |
          helm template order-service charts/order-service \
            -f environments/staging/values.yaml

      - name: Template chart (prod)
        run: |
          helm template order-service charts/order-service \
            -f environments/prod/values.yaml

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-chart
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: write
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout IaC repo
        uses: actions/checkout@v4

      - name: Checkout monolith source
        uses: actions/checkout@v4
        with:
          repository: Cognition-Partner-Workshops/quickapp-monolith
          path: monolith-src

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image metadata
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${SHA_SHORT}"
          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -f docker/order-service/Dockerfile \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest \
            monolith-src/

      - name: Push Docker image to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

  update-helm-values:
    name: Update Helm Values with New Image Tag
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - name: Checkout IaC repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in values.yaml
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
          sed -i "s|^  tag:.*|  tag: ${IMAGE_TAG}|" charts/order-service/values.yaml

      - name: Commit and push updated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/order-service/values.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(order-service): update image tag to ${{ needs.build-and-push.outputs.image-tag }}"
          git push
